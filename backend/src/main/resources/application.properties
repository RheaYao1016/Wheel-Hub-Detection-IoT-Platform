spring.application.name=wheel-hub-backend
server.port=${SERVER_PORT:18081}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3005,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3005}
app.data-dir=${APP_DATA_HOME:./data}
app.auth.session-hours=${APP_AUTH_SESSION_HOURS:12}
app.ai-ml.base-url=${APP_AI_ML_BASE_URL:http://localhost:18100}
# Security secret - MUST be set in production (min 32 characters)
# Generate a strong key using: SecretCodecService.generateSecretKey()
# IMPORTANT: Never use the default value in production!
app.security.secret=${APP_SECURITY_SECRET:}

# Demo accounts - disabled by default for security
# Set to true ONLY in development/testing environments
app.enable-demo-accounts=${APP_ENABLE_DEMO_ACCOUNTS:true}

# File upload security limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
spring.servlet.multipart.enabled=true

# Server hardening
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.tomcat.max-http-form-post-size=50MB

# Jackson configuration for security
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-enums=true

# Logging configuration
logging.level.com.rheayao.wheelhub=INFO
logging.level.org.springframework.web=WARN
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS

# ===================== SpringDoc OpenAPI (Swagger) =====================
# Swagger UI path: http://localhost:18081/swagger-ui.html
# OpenAPI JSON:    http://localhost:18081/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.api-docs.enabled=true
# Security: Disable Swagger UI in production by default
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ===================== Redis Distributed Cache =====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=3000

# Lettuce Connection Pool Configuration
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000

# Cache TTL Configuration (in seconds)
app.cache.dashboard.ttl=60
app.cache.statistics.ttl=300
app.cache.session.ttl=43200

# ===================== Sentry Error Tracking & Performance Monitoring =====================
# Sentry DSN - Get from https://sentry.io/settings/projects/
# Leave empty to disable Sentry in development
sentry.dsn=${SENTRY_DSN:}

# Environment (development, staging, production)
sentry.environment=${SENTRY_ENVIRONMENT:development}

# Tracing sample rate (0.0 to 1.0) - 10% in production
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}

# Performance profiling sample rate
sentry.profiles-sample-rate=${SENTRY_PROFILES_SAMPLE_RATE:0.1}

# Enable request body capture for errors
sentry.send-default-pii=true

# Exception resolver order
sentry.exception-resolver-order=-2147483647

# Logging integration - capture logs at ERROR level
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
