# ============================================================
# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Production enhancements:
# - Resource limits (CPU/Memory)
# - No port exposure (only Nginx reverse proxy)
# - Production secrets via .env file
# - Logging configuration
# - Health checks with restart policies
# ============================================================

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: ${DB_USER:-wheel_hub_user}
      POSTGRES_DB: ${DB_NAME:-wheel_hub_platform}
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-wheel_hub_platform}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-wheel_hub_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      APP_SECURITY_SECRET: ${APP_SECURITY_SECRET:?APP_SECURITY_SECRET is required}
      APP_DATA_HOME: /app/data
      TZ: ${TZ:-Asia/Shanghai}
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      DATABASE_URL: postgresql://${DB_USER:-wheel_hub_user}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-wheel_hub_platform}?schema=public
      NODE_ENV: production
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------
  # Nginx Reverse Proxy (Production only)
  # -----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: wheel-hub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - wheel-hub-network
